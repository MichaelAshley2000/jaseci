name: Runtime cache diagnostic 9840 (Jac 0.34.21)

on:
  push:
    branches: [diagnostics/9840-runtime-cache-03420]
    paths:
      - diagnostics/9840/**
      - .github/workflows/runtime-cache-9840.yml

permissions:
  contents: read

concurrency:
  group: runtime-cache-9840-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
      JAC_TEST_NATIVE: "1"
      JAC_NO_DEV_SOURCE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: diagnostics/9840
      - name: Prepare independent fixture and pinned official runtime
        id: runtime_setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-cache-9840"
          cp diagnostics/9840/*.jac "$RUNNER_TEMP/runtime-cache-9840/"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/jaseci-labs/jac/releases/download/v0.34.21/jac-0.34.21-linux-x86_64 \
            --output "$RUNNER_TEMP/runtime-cache-9840/jac"
          cd "$RUNNER_TEMP/runtime-cache-9840"
          echo '36fdb2c29f43fbcbb938be6649bb40ec362de0530ac62ff7d9e027dcbf255027  jac' | sha256sum --check
          chmod +x jac
          {
            echo "workflow_commit=${{ github.sha }}"
            echo 'runtime_source_commit=3b8b97b889a74ee48fc00839fc64976c3c7a07e3'
            sha256sum jac *.jac
            timeout 180 ./jac --version
          } | tee versions.log
          timeout 120 ./jac -m pip install --only-binary=:all: pymongo==4.18.2 redis==6.4.0
          ./jac -m pip show pymongo redis >> versions.log
      - name: Check diagnostic fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-cache-9840"
          timeout 120 ./jac check cache_consistency_test.jac 2>&1 | tee check.log
      - name: Run independent upstream cache contract scenarios
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-cache-9840"
          timeout 180 ./jac test cache_consistency_test.jac -v 2>&1 | tee runtime-cache-diagnostic.log
      - name: Check ordinary Mongo commit-failure diagnostic
        if: ${{ !cancelled() && steps.runtime_setup.outcome == 'success' }}
        id: commit_failure_check
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-cache-9840"
          timeout 120 ./jac check runtime_commit_failure_test.jac 2>&1 | tee commit-failure-check.log
      - name: Run separate ordinary Mongo commit-failure contract
        if: ${{ !cancelled() && steps.commit_failure_check.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-cache-9840"
          timeout 180 ./jac test runtime_commit_failure_test.jac -v 2>&1 | tee runtime-commit-failure.log
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-9840-jac-0.34.21-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-cache-9840/versions.log
            ${{ runner.temp }}/runtime-cache-9840/check.log
            ${{ runner.temp }}/runtime-cache-9840/runtime-cache-diagnostic.log
            ${{ runner.temp }}/runtime-cache-9840/commit-failure-check.log
            ${{ runner.temp }}/runtime-cache-9840/runtime-commit-failure.log
          if-no-files-found: warn
          retention-days: 14
